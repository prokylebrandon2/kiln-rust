// Packaging only. The app is Rust: `libkiln_android.so` (built by cargo-ndk, see
// .github/workflows/build.yml) is copied into src/main/jniLibs/<abi>/ before Gradle runs, and
// Android's own android.app.NativeActivity loads it. There is no Java or Kotlin in the build,
// and no AndroidX, Shizuku or other library.
plugins {
    id 'com.android.application'
}

// Which CPU types the APK carries (a comma list: gradle -PkilnAbis=arm64-v8a,x86_64). Every ABI adds
// a whole copy of the Rust + Skia library, so the default is the one every phone of the last decade
// uses. x86_64 is only for emulators and some Chromebooks.
def kilnAbis = (findProperty('kilnAbis') ?: 'arm64-v8a').toString().split(',')*.trim().findAll { it }

android {
    namespace 'app.kiln'
    compileSdk 34

    defaultConfig {
        applicationId "app.kiln"
        minSdk 30            // Android 11+: simple "all files access" permission
        targetSdk 34
        versionCode 32
        versionName "4.0.5"
        ndk { abiFilters.addAll(kilnAbis) }
    }

    // src/main/java and src/main/aidl still hold the old Java app, kept only as the reference the
    // Rust port is checked against until it is deleted. Nothing in them is compiled.
    sourceSets {
        main {
            java.srcDirs = []
            aidl.srcDirs = []
        }
    }

    buildFeatures { buildConfig false }

    // The native library is stored uncompressed and page-aligned in the APK, and Android maps it
    // from there (the manifest gets extractNativeLibs="false"). The installed size is then one
    // copy of the library. Compressing it (useLegacyPackaging true) makes the download smaller,
    // but Android then unpacks a second, full copy at install time, and both count toward the
    // app's size.
    packaging {
        jniLibs { useLegacyPackaging false }
        resources { excludes += ['META-INF/**', 'kotlin/**', '**/*.kotlin_*'] }
    }
}
