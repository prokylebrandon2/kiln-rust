# Builds an Android APK that bundles the Kiln command-line binary.
#
# NOTE: written in Phase 2 but NOT executed by the author - the authoring environment could not
# reach the Android SDK/NDK downloads or a GitHub runner. The YAML was linted and the Java
# source compile-checked against stubs; the first real run may need version tweaks (the pinned
# SDK, NDK and Android Gradle Plugin versions below are the most likely candidates).
#
# What it does
#   1. Cross-compiles the `kiln` binary for arm64-v8a and x86_64 with cargo-ndk.
#   2. Copies each binary to android/app/src/main/jniLibs/<abi>/libkiln.so (Android only
#      extracts files named lib*.so, and the app runs it from its native library directory).
#   3. Builds the debug APK with Gradle (and the release APK on tags or when requested).
#   4. Checks the binaries really are inside the APK, then uploads the APK(s) as artifacts.
#
# Signing a release APK needs these repository secrets (otherwise the release APK is unsigned
# and cannot be installed):
#   ANDROID_KEYSTORE_BASE64    the .jks file, base64-encoded   (base64 -w0 release.jks)
#   ANDROID_KEYSTORE_PASSWORD  ANDROID_KEY_ALIAS  ANDROID_KEY_PASSWORD
name: android-apk

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also build the release APK (signed if the signing secrets exist)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in step with android/app/build.gradle.kts (compileSdk) and the NDK you want to test.
  ANDROID_PLATFORM: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  # Lowest Android API the binary targets; must equal minSdk in android/app/build.gradle.kts.
  ANDROID_MIN_API: "24"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      BUILD_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Point the build at the NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cross-compile kiln for Android
        run: |
          set -euo pipefail
          cargo ndk -t arm64-v8a -t x86_64 --platform "$ANDROID_MIN_API" \
            build --release --locked --bin kiln
          for pair in aarch64-linux-android:arm64-v8a x86_64-linux-android:x86_64; do
            triple="${pair%%:*}"; abi="${pair##*:}"
            dest="android/app/src/main/jniLibs/$abi"
            mkdir -p "$dest"
            cp "target/$triple/release/kiln" "$dest/libkiln.so"
            file "$dest/libkiln.so"
          done

      # No Gradle wrapper is committed (it could not be generated offline); install Gradle itself.
      # 8.14.x satisfies the Android Gradle Plugin 8.9.2 pinned in android/build.gradle.kts.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Prepare release signing key
        if: env.BUILD_RELEASE == 'true' && env.HAVE_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kiln-release.jks"
          {
            echo "KILN_KEYSTORE_FILE=$RUNNER_TEMP/kiln-release.jks"
            echo "KILN_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "KILN_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "KILN_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        if: env.BUILD_RELEASE == 'true'
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Check the kiln binaries are inside the APK(s)
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/*/*.apk)
          [ "${#apks[@]}" -gt 0 ] || { echo "no APK was produced"; exit 1; }
          for apk in "${apks[@]}"; do
            echo "== $apk"
            listing="$(unzip -l "$apk")"
            for abi in arm64-v8a x86_64; do
              grep -q "lib/$abi/libkiln.so" <<<"$listing" \
                || { echo "lib/$abi/libkiln.so missing from $apk"; exit 1; }
            done
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kiln-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: env.BUILD_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kiln-release-apk${{ env.HAVE_KEYSTORE == 'true' && '' || '-UNSIGNED' }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
