[package]
name = "kiln"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "High-performance multicore archiver (Rust rewrite of Kiln) - Phase 3 performance and the .kiln format"
readme = "README.md"
publish = false

[workspace]
members = ["bridge", "platform", "ui", "app", "skln"]
# The fuzz crate (cargo-fuzz) is built on its own, with a nightly toolchain.
exclude = ["fuzz"]

[workspace.dependencies]
# The UI toolkit for the Android app (see ui/). Pinned exactly: `slint`, `slint-build` and Slint's
# Android backend must be the very same version. `default-features = false` keeps out the desktop
# backends and the std-widgets styles; `std` and `compat-1-2` are mandatory;
# `backend-android-activity-06` is the NativeActivity backend (android-activity 0.6).
#
# No renderer feature is named on purpose: Slint's Android backend draws with Skia and nothing
# else (`renderer-femtovg` is not available on Android), and it pulls Skia in by itself. Building
# it needs a JDK and the Android SDK (a platform and the build-tools) because the backend compiles
# a small Java helper (soft keyboard, clipboard, back gesture, system insets) into the library;
# .github/workflows/build.yml installs both.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-android-activity-06",
] }

[lib]
name = "kiln"
path = "src/lib.rs"

[[bin]]
name = "kiln"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
crossbeam-channel = "0.5"
liblzma = "0.4"
lz4_flex = "0.14"
tempfile = "3"
thiserror = "2"
walkdir = "2"
zstd = "0.14"

# Extended attributes and descriptor-relative file operations (Unix only). Both are safe wrappers,
# so this crate stays `forbid(unsafe_code)`. `rustix` is already in Cargo.lock (tempfile and
# xattr use it); `fs` is the only feature this crate needs (see src/secure.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
xattr = "1"

[profile.release]
# Size first, speed where it is felt: everything that is not on the hot path (fonts, text, images,
# SVG, JSON, the Android glue) is optimised for size, and the packages below stay at full speed.
opt-level = "s"
# "fat" LTO lets the linker drop everything the app never calls (clap's CLI code, unused helpers
# of the codecs, unused parts of Slint) across all crates, not only inside each one.
lto = "fat"
codegen-units = 1
debug = false
# Symbols are only for reading crash backtraces, and the symbol table of a library that links Skia
# is several MB. (A crash report then shows addresses instead of function names.)
strip = "symbols"
# panic = "unwind" (the default) is deliberate: temp-file guards must run on a panic.

# The engine, the codecs and the ciphers decide how fast packing and unpacking are.
[profile.release.package.kiln]
opt-level = 3
[profile.release.package.kiln-bridge]
opt-level = 3
[profile.release.package.kiln-skln]
opt-level = 3
[profile.release.package.zstd]
opt-level = 3
[profile.release.package.zstd-safe]
opt-level = 3
[profile.release.package.zstd-sys]
opt-level = 3
[profile.release.package.liblzma]
opt-level = 3
[profile.release.package.liblzma-sys]
opt-level = 3
[profile.release.package.lz4_flex]
opt-level = 3
[profile.release.package.blake3]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
[profile.release.package.scrypt]
opt-level = 3
[profile.release.package.salsa20]
opt-level = 3
[profile.release.package.pbkdf2]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
# Every frame goes through these: the property system and the generated UI code.
[profile.release.package.i-slint-core]
opt-level = 3
[profile.release.package.kiln-ui]
opt-level = 3

[profile.dev]
# Compression is unusably slow at opt-level 0; keep tests fast.
opt-level = 1
