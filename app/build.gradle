// Packaging only. The app is Rust: `libkiln_android.so` (built by cargo-ndk, see
// .github/workflows/build.yml) is copied into src/main/jniLibs/<abi>/ before Gradle runs, and
// Android's own android.app.NativeActivity loads it. There is no Java or Kotlin in the build,
// and no AndroidX, Shizuku or other library.
plugins {
    id 'com.android.application'
}

android {
    namespace 'app.kiln'
    compileSdk 34

    defaultConfig {
        applicationId "app.kiln"
        minSdk 30            // Android 11+: simple "all files access" permission
        targetSdk 34
        versionCode 32
        versionName "4.0.5"
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }

    // src/main/java and src/main/aidl still hold the old Java app, kept only as the reference the
    // Rust port is checked against until it is deleted. Nothing in them is compiled.
    sourceSets {
        main {
            java.srcDirs = []
            aidl.srcDirs = []
        }
    }

    buildFeatures { buildConfig false }
}
