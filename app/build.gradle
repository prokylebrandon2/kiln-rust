plugins {
    id 'com.android.application'
}

android {
    namespace 'app.kiln'
    compileSdk 34

    defaultConfig {
        applicationId "app.kiln"
        minSdk 30            // Android 11+: simple "all files access" permission
        targetSdk 34
        versionCode 32
        versionName "4.0.5"
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }

    buildFeatures { aidl true }      // IPrivService: the Shizuku user service

    // libkiln_bridge.so is an executable (the Rust engine's bridge), not a JNI library: it has to
    // exist as a real file in nativeLibraryDir so Engine can launch it.
    packagingOptions { jniLibs { useLegacyPackaging true } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"   // FileProvider: lets other apps open files
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"   // pull down to refresh
    implementation "dev.rikka.shizuku:api:13.1.5"        // Shizuku: browse protected folders
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
