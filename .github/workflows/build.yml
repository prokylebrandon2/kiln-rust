name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17, not 21: Slint's Android backend compiles a small Java helper with javac and D8
      # while it builds, and JDK 21 breaks that step with older SDK build-tools.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # The same build step needs an Android SDK *platform* (android.jar) and the build-tools (D8).
      # Without a platform it stops with "No Android platforms found", so install them explicitly
      # and say where the SDK is for build scripts that look at ANDROID_SDK_ROOT.
      - name: Install the Android SDK platform and build-tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/platforms"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      # kiln-platform is the whole app as one native library, libkiln_android.so: the entry point,
      # the Slint UI, the app logic and the engine. cargo-ndk puts it into jniLibs/<abi>/, where
      # Gradle packs it; android.app.NativeActivity loads it. Skia's prebuilt libraries are
      # downloaded by its build script, so this step needs network access.
      - name: Build libkiln_android.so with the NDK
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          cargo install cargo-ndk
          cargo ndk -t arm64-v8a -t x86_64 --platform 30 -o app/src/main/jniLibs build --release -p kiln-platform
          ls -l app/src/main/jniLibs/*/

      - name: Build the APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Check what is in the APK
        run: |
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          echo "APK: $apk"
          unzip -l "$apk" | grep -E 'lib/(arm64-v8a|x86_64)/libkiln_android\.so'
          test "$(unzip -l "$apk" | grep -c 'libkiln_android\.so')" -eq 2
          if unzip -l "$apk" | grep -E 'classes[0-9]*\.dex'; then
            echo "note: the APK contains Dalvik code"
          else
            echo "no Java or Kotlin code in the APK"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kiln-apk
          path: app/build/outputs/apk/debug/*.apk

      # Cargo.lock is not committed with the new dependencies: hand back the one CI resolved.
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
