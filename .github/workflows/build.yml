name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK platform and build-tools
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Set Android JAR path
        shell: bash
        run: |
          jar="$(ls "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -n 1)"
          echo "android.jar: $jar"
          echo "ANDROID_JAR=$jar" >> "$GITHUB_ENV"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build libkiln_android.so with the NDK
        shell: bash
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t x86_64 --platform 30 -o app/src/main/jniLibs build --release -p kiln-platform
          ls -l app/src/main/jniLibs/*/

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contents
        shell: bash
        run: |
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          echo "APK: $apk"

          unzip -l "$apk" | grep -E 'lib/(arm64-v8a|x86_64)/libkiln_android\.so'

          test "$(unzip -l "$apk" | grep -c 'libkiln_android\.so')" -eq 2

          if unzip -l "$apk" | grep -E 'classes[0-9]*\.dex'; then
            echo "note: the APK contains Dalvik code"
          else
            echo "no Java or Kotlin code in the APK"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kiln-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock