# NOTE: written in Phase 1 but not executed by the author (no GitHub runner was available).
name: ci
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - run: cargo check --locked --all-targets

  # src/secure.rs and tests/hardening.rs are Unix code; macOS exercises the non-Linux branches
  # (no /proc/self/fd). Windows keeps the path-based fallback and is not covered here yet.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test --locked

  # The `.skln` crate is a workspace member, not the root package, so the jobs above never format,
  # lint or test it. The Python step checks the golden files against the independent implementation.
  skln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo fmt -p kiln-skln --check
      - run: cargo clippy --locked -p kiln-skln --all-targets -- -D warnings
      - run: cargo test --locked -p kiln-skln

      - run: |
          pip install cryptography
          python3 -I skln/tests/golden/make_v1.py --verify
