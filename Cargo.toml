[package]
name = "kiln"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "High-performance multicore archiver (Rust rewrite of Kiln) - Phase 3 performance and the .kiln format"
readme = "README.md"
publish = false

[workspace]
members = ["bridge", "platform", "ui", "app"]
# The fuzz crate (cargo-fuzz) is built on its own, with a nightly toolchain.
exclude = ["fuzz"]

[workspace.dependencies]
# The UI toolkit for the Android app (see ui/). Pinned exactly: `slint`, `slint-build` and Slint's
# Android backend must be the very same version. `default-features = false` keeps out the desktop
# backends and the std-widgets styles; `std` and `compat-1-2` are mandatory;
# `backend-android-activity-06` is the NativeActivity backend (android-activity 0.6).
#
# No renderer feature is named on purpose: Slint's Android backend draws with Skia and nothing
# else (`renderer-femtovg` is not available on Android), and it pulls Skia in by itself. Building
# it needs a JDK and the Android SDK (a platform and the build-tools) because the backend compiles
# a small Java helper (soft keyboard, clipboard, back gesture, system insets) into the library;
# .github/workflows/build.yml installs both.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-android-activity-06",
] }

[lib]
name = "kiln"
path = "src/lib.rs"

[[bin]]
name = "kiln"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
crossbeam-channel = "0.5"
liblzma = "0.4"
lz4_flex = "0.14"
tempfile = "3"
thiserror = "2"
walkdir = "2"
zstd = "0.14"

# Extended attributes and descriptor-relative file operations (Unix only). Both are safe wrappers,
# so this crate stays `forbid(unsafe_code)`. `rustix` is already in Cargo.lock (tempfile and
# xattr use it); `fs` is the only feature this crate needs (see src/secure.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
xattr = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "debuginfo"
# panic = "unwind" (the default) is deliberate: temp-file guards must run on a panic.

[profile.dev]
# Compression is unusably slow at opt-level 0; keep tests fast.
opt-level = 1
