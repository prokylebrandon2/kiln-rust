plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'app.kiln'
    compileSdk 34

    defaultConfig {
        applicationId "app.kiln"
        minSdk 30            // Android 11+: simple "all files access" permission
        targetSdk 34
        versionCode 2
        versionName "2.0"
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }

    // kiln loads its C helper with ctypes, which needs a real file on disk.
    packagingOptions { jniLibs { useLegacyPackaging true } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version "3.12"
        pip { install "cryptography" }   // AES-256-GCM for encrypted archives
    }
}
