# NOTE: written in Phase 1 but not executed by the author (no GitHub runner was available).
name: ci
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - run: cargo check --locked --all-targets

  # src/secure.rs and tests/hardening.rs are Unix code; macOS exercises the non-Linux branches
  # (no /proc/self/fd). Windows keeps the path-based fallback and is not covered here yet.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test --locked

  # The `.skln` crate is a workspace member, not the root package, so the jobs above never format,
  # lint or test it. The Python step checks the golden files against the independent implementation.
  skln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo fmt -p kiln-skln --check
      - run: cargo clippy --locked -p kiln-skln --all-targets -- -D warnings
      - run: cargo test --locked -p kiln-skln

      - run: |
          pip install cryptography
          python3 -I skln/tests/golden/make_v1.py --verify

  # The UI rewrite (docs/UI-REWRITE.md). Both jobs need no Android SDK and no Skia, so they take a
  # minute or two instead of the APK build's quarter of an hour. They run without --locked on
  # purpose: the two new crates were added to Cargo.lock by hand.
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # not blocking until `cargo fmt -p kiln-state` has been run once by someone with a compiler
      - run: cargo fmt -p kiln-state --check
        continue-on-error: true
      - run: cargo clippy -p kiln-state --all-targets -- -D warnings
      - run: cargo test -p kiln-state

  # Compiles every .slint file of the new UI (the app window and the preview window), after two
  # script checks that need only Python.
  ui-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: python3 tools/ui/slint_lint.py ui-next/ui/lib.slint

      # icons.slint is generated; fail if it was edited by hand or the legacy icons changed
      - run: |
          python3 tools/ui/gen_icons_next.py
          git diff --exit-code -- ui-next/ui/icons.slint

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo check -p kiln-ui-next
