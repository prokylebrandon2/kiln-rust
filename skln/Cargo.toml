[package]
name = "kiln-skln"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "The .skln container: authenticated encryption of bytes under a raw 32-byte key (see docs/FORMAT.md)"
publish = false

[lib]
name = "kiln_skln"
path = "src/lib.rs"

[dependencies]
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
zeroize = "1"