name: Build APK

on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'CPU types to build, comma separated (arm64-v8a is every phone; add x86_64 for emulators)'
        required: false
        default: 'arm64-v8a'
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KILN_ABIS: ${{ github.event.inputs.abis || 'arm64-v8a' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK platform and build-tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set Android JAR path
        shell: bash
        run: |
          jar="$(ls "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -n 1)"
          echo "android.jar: $jar"
          echo "ANDROID_JAR=$jar" >> "$GITHUB_ENV"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Validate Android ABIs
        shell: bash
        run: |
          set -euo pipefail

          IFS=',' read -ra ABIS <<< "$KILN_ABIS"

          if [ "${#ABIS[@]}" -eq 0 ]; then
            echo "No Android ABIs specified."
            exit 1
          fi

          for abi in "${ABIS[@]}"; do
            abi="$(echo "$abi" | xargs)"

            case "$abi" in
              arm64-v8a|x86_64)
                ;;
              *)
                echo "Unsupported ABI: $abi"
                exit 1
                ;;
            esac
          done

      - name: Build libkiln_android.so with the NDK
        shell: bash
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,--pack-dyn-relocs=android"
        run: |
          set -euo pipefail

          cargo install cargo-ndk --locked

          targets=()

          IFS=',' read -ra ABIS <<< "$KILN_ABIS"

          for abi in "${ABIS[@]}"; do
            abi="$(echo "$abi" | xargs)"
            targets+=(-t "$abi")
          done

          cargo ndk "${targets[@]}" --platform 30 \
            -o app/src/main/jniLibs \
            build --release -p kiln-platform

          echo "Built native libraries:"
          find app/src/main/jniLibs -type f -name '*.so' -print

      - name: Build APK
        run: |
          gradle :app:assembleDebug \
            -PkilnAbis="$KILN_ABIS" \
            --stacktrace

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail

          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"

          if [ -z "$apk" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK: $apk"

          IFS=',' read -ra ABIS <<< "$KILN_ABIS"

          for abi in "${ABIS[@]}"; do
            abi="$(echo "$abi" | xargs)"

            case "$abi" in
              arm64-v8a|x86_64)
                ;;
              *)
                echo "Unsupported ABI: $abi"
                exit 1
                ;;
            esac

            if ! unzip -l "$apk" | grep -q "lib/$abi/libkiln_android.so"; then
              echo "Missing native library for ABI: $abi"
              exit 1
            fi
          done

          want="${#ABIS[@]}"
          actual="$(unzip -l "$apk" | grep -c 'libkiln_android\.so' || true)"

          if [ "$actual" -ne "$want" ]; then
            echo "Expected $want native libraries, found $actual."
            exit 1
          fi

          ls -lh "$apk"

          if unzip -l "$apk" | grep -Eq 'classes[0-9]*\.dex'; then
            echo "Note: the APK contains Dalvik code."
          else
            echo "No Java or Kotlin code in the APK."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kiln-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error