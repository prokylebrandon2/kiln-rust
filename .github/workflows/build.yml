
name: Build APK

on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'CPU types to build, comma separated (arm64-v8a is every phone; add x86_64 for emulators)'
        required: false
        default: 'arm64-v8a'
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Build only the requested ABIs.
      KILN_ABIS: ${{ github.event.inputs.abis || 'arm64-v8a' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK platform and build-tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set Android JAR path
        shell: bash
        run: |
          jar="$(ls "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -n 1)"
          echo "android.jar: $jar"
          echo "ANDROID_JAR=$jar" >> "$GITHUB_ENV"

      - name: Set up Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Show Rust environment
        shell: bash
        run: |
          rustc --version --verbose
          cargo --version
          uname -m

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify workflow being executed
        shell: bash
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Workflow: $GITHUB_WORKFLOW"
          grep -R -n "cargo install cargo-ndk" .github/workflows || true
          grep -R -n "cargo binstall cargo-ndk" .github/workflows || true

      - name: Install cargo-ndk (prebuilt only)
        shell: bash
        run: |
          cargo binstall cargo-ndk@4.1.2 \
            --no-confirm \
            --disable-strategies compile,quick-install

          cargo ndk --version

      - name: Build libkiln_android.so with the NDK
        shell: bash
        run: |
          targets=()
          for abi in ${KILN_ABIS//,/ }; do
            targets+=(-t "$abi")
          done

          RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,--pack-dyn-relocs=android" \
            cargo ndk "${targets[@]}" --platform 30 -o app/src/main/jniLibs build --release -p kiln-platform

          ls -l app/src/main/jniLibs/*/

      - name: Build APK
        run: gradle :app:assembleDebug -PkilnAbis="$KILN_ABIS" --stacktrace

      - name: Verify APK contents
        shell: bash
        run: |
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          echo "APK: $apk"

          unzip -l "$apk" | grep -E 'lib/(arm64-v8a|x86_64)/libkiln_android\.so'

          want="$(echo "${KILN_ABIS//,/ }" | wc -w)"
          test "$(unzip -l "$apk" | grep -c 'libkiln_android\.so')" -eq "$want"
          ls -l "$apk"

          if unzip -l "$apk" | grep -E 'classes[0-9]*\.dex'; then
            echo "note: the APK contains Dalvik code"
          else
            echo "no Java or Kotlin code in the APK"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kiln-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
