name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy needs a build-time Python of the same version as the one in the app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build kiln's C helper with the NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ls "$BIN" | grep -E 'aarch64-linux-android30-clang$|x86_64-linux-android30-clang$'
          for pair in arm64-v8a:aarch64 x86_64:x86_64; do
            abi="${pair%%:*}"; triple="${pair##*:}"
            python tools/build_accel.py app/src/main/python/kiln_v14.py \
              "app/src/main/jniLibs/$abi/libkiln_accel.so" \
              "$BIN/${triple}-linux-android30-clang" -Wl,-z,max-page-size=16384
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      # The Rust engine is part of the app: it goes into jniLibs next to the C helper.
      - name: Build libkiln_rs.so with the NDK
        working-directory: rust/kiln-rs
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t x86_64 --platform 30 -o ../../app/src/main/jniLibs build --release
          ls -l ../../app/src/main/jniLibs/*/

      - name: Build the APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kiln-apk
          path: app/build/outputs/apk/debug/*.apk

  # The Rust engine's tests (the library itself is built into the APK by the job above).
  rust-engine:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Test corpus (made by the real Python engine)
        working-directory: rust
        run: |
          pip install cryptography
          python tools/make_corpus.py ../app/src/main/python/kiln_v14.py tests/corpus

      - name: MP3 test corpus (ffmpeg makes the MP3s, the real engine packs them)
        working-directory: rust
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python tools/make_mp3_corpus.py ../app/src/main/python/kiln_v14.py tests/mp3corpus
          python tools/make_mp3_fuzz.py ../app/src/main/python/kiln_v14.py tests/mp3corpus 40

      - name: "Packer test vectors (range encoder, match finder, block builder: real C / Python engine)"
        working-directory: rust
        run: |
          python tools/make_enc_vectors.py ../app/src/main/python/kiln_v14.py tests/encvec
          python tools/make_lz_vectors.py ../app/src/main/python/kiln_v14.py tests/lzvec
          python tools/make_blk_vectors.py ../app/src/main/python/kiln_v14.py tests/blkvec

      - name: Rust tests
        working-directory: rust/kiln-rs
        run: cargo test --release

      - name: The compiled library against the real Python engine
        working-directory: rust
        run: |
          for part in open test extract cancel fnmatch unsupported sets sets2 sets3 sets4 sets5; do
            echo "== $part"; python tests/rs_so/run.py kiln-rs/target/release/libkiln_rs.so ../app/src/main/python tests/corpus $part | tee /tmp/part.log
            ! grep -q '^FAIL' /tmp/part.log
          done
          python tests/rs_so/test_mp3_so.py kiln-rs/target/release/libkiln_rs.so ../app/src/main/python tests/mp3corpus
          python tests/rs_so/test_pack_each_so.py kiln-rs/target/release/libkiln_rs.so ../app/src/main/python

      - name: Build libkiln_rs.so for Android
        working-directory: rust/kiln-rs
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t x86_64 --platform 30 -o ../out build --release
          ls -l ../out/*/

      - uses: actions/upload-artifact@v4
        with:
          name: kiln-rust-engine
          path: rust/out/*/libkiln_rs.so
