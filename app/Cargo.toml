[package]
name = "kiln-app"
version = "0.5.0"
edition = "2024"
description = "The Kiln Android app's logic: wires the Slint UI (kiln-ui-next) to the file system and to the platform"
publish = false

[lib]
name = "kiln_app"
path = "src/lib.rs"

[dependencies]
kiln-bridge = { path = "../bridge" }
kiln-state = { path = "../state" }
kiln-ui-next = { path = "../ui-next" }
serde_json = "1"
slint = { workspace = true }
